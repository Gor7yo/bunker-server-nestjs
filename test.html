<!doctype html>
<html>
  <head>
    <title>Тест Socket.io</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
      body {
        font-family: Arial;
        padding: 20px;
      }
      button {
        margin: 5px;
        padding: 10px;
        cursor: pointer;
      }
      pre {
        background: #f4f4f4;
        padding: 15px;
        border-radius: 5px;
        max-height: 500px;
        overflow-y: auto;
      }
      .log-area {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <h2>🎮 Тест подключения к игре Бункер</h2>

    <div>
      <button onclick="createRoom()">🏠 Создать комнату</button>
      <button onclick="joinRoom()">🚪 Подключиться к комнате</button>
      <button onclick="setReady()">✅ Готов</button>
      <button onclick="startGame()">🎮 Старт игры (ведущий)</button>
      <button onclick="getMyCard()">🃏 Моя карта</button>
    </div>

    <div class="log-area">
      <h3>Логи:</h3>
      <pre id="log">⏳ Ожидание подключения...</pre>
    </div>

    <script>
      // ===== ПОДКЛЮЧЕНИЕ =====
      const socket = io('http://localhost:3000/room', {
        transports: ['websocket', 'polling'],
      });

      let roomCode = null;
      let playerName = 'Игрок' + Math.floor(Math.random() * 100);

      // ===== ЛОГГЕР =====
      const log = (msg) => {
        const pre = document.getElementById('log');
        pre.textContent += '\n' + new Date().toLocaleTimeString() + ' | ' + msg;
        pre.scrollTop = pre.scrollHeight;
      };

      // ===== СОБЫТИЯ =====
      socket.on('connect', () => {
        log('✅ Подключено! ID: ' + socket.id);
      });

      socket.on('connect_error', (err) => {
        log('❌ Ошибка подключения: ' + err.message);
      });

      socket.on('room:created', (data) => {
        roomCode = data.roomCode;
        log('📦 Комната создана: ' + JSON.stringify(data, null, 2));
      });

      socket.on('room:joined', (data) => {
        roomCode = data.roomCode;
        log('📦 Подключен к комнате: ' + JSON.stringify(data, null, 2));
      });

      socket.on('room:playerJoined', (data) => {
        log('👤 Игрок подключился: ' + JSON.stringify(data, null, 2));
      });

      socket.on('player:readyUpdated', (data) => {
        log('✅ Статус готовности: ' + JSON.stringify(data, null, 2));
      });

      socket.on('game:allReady', (data) => {
        log('🎯 Все готовы! ' + data.message);
      });

      socket.on('game:started', (data) => {
        log('🎮 Игра началась! ' + JSON.stringify(data, null, 2));
      });

      socket.on('player:cardReceived', (data) => {
        log('🃏 Получена карта: ' + JSON.stringify(data.character, null, 2));
        alert('🎴 Твоя карта:\n' + JSON.stringify(data.character, null, 2));
      });

      socket.on('room:error', (data) => {
        log('❌ Ошибка: ' + data.message);
      });

      // ===== КНОПКИ =====
      function createRoom() {
        const name = prompt('Введите имя ведущего:', playerName);
        if (name) {
          playerName = name;
          socket.emit('room:create', { hostName: name });
          log('📤 Отправлено: room:create');
        }
      }

      function joinRoom() {
        const code = prompt('Введите код комнаты:');
        if (!code) return;

        const name = prompt('Введите ваше имя:', playerName);
        if (!name) return;
        playerName = name;

        socket.emit('room:join', { roomCode: code, playerName: name });
        log('📤 Отправлено: room:join');
      }

      function setReady() {
        if (!roomCode) {
          alert('Сначала подключитесь к комнате!');
          return;
        }
        socket.emit('player:ready', { roomCode });
        log('📤 Отправлено: player:ready');
      }

      function startGame() {
        if (!roomCode) {
          alert('Сначала подключитесь к комнате!');
          return;
        }
        socket.emit('game:start', { roomCode });
        log('📤 Отправлено: game:start');
      }

      function getMyCard() {
        if (!roomCode) {
          alert('Сначала подключитесь к комнате!');
          return;
        }
        socket.emit('player:myCard', { roomCode }); // 👈 отправляет запрос
        log('📤 Отправлено: player:myCard');
      }

      // ===== ИНФО =====
      log('🔌 Подключение к серверу...');
    </script>
  </body>
</html>
